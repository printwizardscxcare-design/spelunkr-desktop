name: Check downloaded Mac installers
on:
  workflow_dispatch:
    inputs:
      mac-run:
        description: Successful Mac installers workflow run to check
        required: true
permissions:
  contents: read
  actions: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: Spelunkr-Desktop-Mac-${{ matrix.arch }}
          path: installer
          run-id: ${{ inputs.mac-run }}
          github-token: ${{ github.token }}
      - name: Verify installer and check it without any build-machine libraries
        run: |
          (cd installer && shasum -a 256 -c SHA256SUMS-Mac-${{ matrix.arch }}.txt)
          mkdir -p "$RUNNER_TEMP/spelunkr-dmg"
          hdiutil attach -nobrowse -readonly installer/*.dmg -mountpoint "$RUNNER_TEMP/spelunkr-dmg"
          APP="$RUNNER_TEMP/spelunkr-dmg/Spelunkr Desktop.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/alphacep/vosk-api/v0.3.45/python/example/test.wav -o "$RUNNER_TEMP/test.wav"
          node scripts/check-whisper.cjs "$APP/Contents/Resources/native/whisper/caption-reader" "$RUNNER_TEMP/test.wav"
          node scripts/check-buffered-whisper.cjs "$APP/Contents/Resources/native/whisper/caption-reader" "$RUNNER_TEMP/test.wav"
          "$APP/Contents/Resources/native/whisper/ffmpeg" -version
          "$APP/Contents/Resources/native/whisper/audiotee" --help
          "$APP/Contents/MacOS/Spelunkr Desktop" > "$RUNNER_TEMP/spelunkr-startup.log" 2>&1 &
          PID=$!
          sleep 12
          kill -0 "$PID"
          kill "$PID"
          wait "$PID" || true
          cat "$RUNNER_TEMP/spelunkr-startup.log"
          sleep 1
          hdiutil detach "$RUNNER_TEMP/spelunkr-dmg"
