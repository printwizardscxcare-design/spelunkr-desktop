name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - name: Write installer checksum
        shell: pwsh
        run: |
          Get-FileHash dist/*-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Spelunkr-Desktop-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Spelunkr-Caption-Runtime-Windows-x64
          path: |
            native/bin/whisper/*.exe
            native/bin/whisper/*.dll
