name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
  POSTHOG_PRIVACY_CONFIGURED: ${{ vars.POSTHOG_PRIVACY_CONFIGURED }}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ensure Electron is installed for the audio check
        run: node node_modules/electron/install.js
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      - name: Check Chromium audio and saved settings
        shell: pwsh
        run: |
          $audioExecutable = node -p "require('electron')"
          $audioCheck = Start-Process -FilePath $audioExecutable -ArgumentList scripts/check-audio-app.cjs -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput audio-check.out.log -RedirectStandardError audio-check.err.log
          Get-Content audio-check.out.log
          Get-Content audio-check.err.log
          if ($audioCheck.ExitCode -ne 0) { exit $audioCheck.ExitCode }
      - run: npm run build:captions
      - uses: actions/upload-artifact@v7
        with:
          name: Spelunkr-Caption-Runtime-Windows-x64
          path: |
            native/bin/whisper/*.exe
            native/bin/whisper/*.dll
      - run: npm run build:preload
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Write installer checksum
        shell: pwsh
        run: |
          Get-FileHash dist/*-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Spelunkr-Desktop-Windows-x64
          path: |
            dist/*-Setup.exe
            dist/SHA256SUMS.txt
