name: Publish tested installers
on:
  workflow_dispatch:
    inputs:
      linux-run:
        description: Successful Linux installers run ID
        required: true
      windows-run:
        description: Successful Windows installer run ID (same source commit)
        required: true
      mac-run:
        description: Successful Mac installers run ID (Intel and Apple Silicon, same source)
        required: true
      linux-check-run:
        description: Optional successful Linux recheck run for exactly the selected Linux build
        required: false
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LINUX_RUN: ${{ inputs.linux-run }}
      WINDOWS_RUN: ${{ inputs.windows-run }}
      MAC_RUN: ${{ inputs.mac-run }}
      LINUX_CHECK_RUN: ${{ inputs.linux-check-run }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify both builds passed and use the same source
        run: |
          node <<'JS'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const repo=process.env.GITHUB_REPOSITORY;
          const getRun=id=>{
            if(!/^\d+$/.test(id||'')) throw Error('Invalid run ID');
            return JSON.parse(execFileSync('gh',['api',`repos/${repo}/actions/runs/${id}`],{encoding:'utf8'}));
          };
          let rechecked=false;
          if(process.env.LINUX_CHECK_RUN){
            const check=getRun(process.env.LINUX_CHECK_RUN);
            if(check.conclusion!=='success'||check.name!==`Linux checks for build ${process.env.LINUX_RUN}`||check.path!=='.github/workflows/linux.yml'||check.head_branch!=='main'||check.event!=='workflow_dispatch'||check.head_repository.full_name!==repo||check.display_title!==`Linux checks for build ${process.env.LINUX_RUN}`) throw Error('Linux recheck must pass against exactly this installer artifact');
            rechecked=true;
          }
          const runs=[['LINUX_RUN','Linux installers'],['WINDOWS_RUN','Windows installer'],['MAC_RUN','Mac installers']].map(([key,name])=>{
            const id=process.env[key];
            const run=getRun(id);
            if((run.conclusion!=='success'&&!(key==='LINUX_RUN'&&rechecked))||run.name!==name||run.head_repository.full_name!==repo) throw Error('Build has not passed: '+name);
            return run;
          });
          if(runs.some(run=>run.head_sha!==runs[0].head_sha)) throw Error('Installers must use the same source commit');
          const version=require('./package.json').version;
          const metadata=JSON.parse(execFileSync('gh',['api',`repos/${repo}/contents/package.json?ref=${runs[0].head_sha}`],{encoding:'utf8'}));
          const builtVersion=JSON.parse(Buffer.from(metadata.content,'base64').toString()).version;
          if(version!==builtVersion) throw Error('Build version differs from the release notes version');
          fs.appendFileSync(process.env.GITHUB_ENV,`SOURCE_SHA=${runs[0].head_sha}\nRELEASE_TAG=v${version}\n`);
          JS
      - uses: actions/download-artifact@v8
        with:
          name: Spelunkr-Desktop-Linux-x64
          path: release/linux
          run-id: ${{ inputs.linux-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: Spelunkr-Desktop-Windows-x64
          path: release/windows
          run-id: ${{ inputs.windows-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: Spelunkr-Desktop-Mac-x64
          path: release/mac-x64
          run-id: ${{ inputs.mac-run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: Spelunkr-Desktop-Mac-arm64
          path: release/mac-arm64
          run-id: ${{ inputs.mac-run }}
          github-token: ${{ github.token }}
      - name: Verify packaged checksums
        run: |
          (cd release/linux && sha256sum -c SHA256SUMS-Linux.txt)
          (cd release/windows && sed -i 's/\r$//' SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          (cd release/mac-x64 && sha256sum -c SHA256SUMS-Mac-x64.txt)
          (cd release/mac-arm64 && sha256sum -c SHA256SUMS-Mac-arm64.txt)
      - name: Create private-repository prerelease with installers
        run: |
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --prerelease --draft --title "Spelunkr Desktop ${RELEASE_TAG#v}" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          gh release upload "$RELEASE_TAG" release/linux/*.deb release/linux/*.rpm release/linux/*.pkg.tar.* release/linux/SHA256SUMS-Linux.txt release/windows/*-Setup.exe release/windows/SHA256SUMS.txt release/mac-*/*.dmg release/mac-*/*.zip release/mac-*/SHA256SUMS-Mac-*.txt
          gh release edit "$RELEASE_TAG" --draft=false
