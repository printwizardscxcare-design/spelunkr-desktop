name: Mac installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MACOSX_DEPLOYMENT_TARGET: '14.2'
      - name: Check Mac app and bundled speech models
        run: |
          APP=$(find dist -maxdepth 2 -name '*.app' -type d | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$APP/Contents/Info.plist"
          "$APP/Contents/Resources/native/whisper/audiotee" --help
          "$APP/Contents/Resources/native/whisper/caption-reader" --test-wav native/bin/test.wav --model tiny.en
          "$APP/Contents/MacOS/Spelunkr Desktop" > /tmp/spelunkr-startup.log 2>&1 &
          PID=$!
          sleep 12
          kill -0 "$PID"
          kill "$PID"
          wait "$PID" || true
          cat /tmp/spelunkr-startup.log
      - name: Write Mac checksums
        run: cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS-Mac-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Spelunkr-Desktop-Mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-Mac-*.txt
