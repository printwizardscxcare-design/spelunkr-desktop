<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Spelunkr Desktop — Unofficial</title>
  <style>
    :root { color-scheme: dark; font-family: 'Segoe UI', sans-serif; background: #140b2d; color: #f6f2ff; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 560px; padding: 48px; }
    .tag { color: #c2b1ec; font-size: 12px; letter-spacing: .18em; }
    .signal { font-size: 64px; color: #d8ff80; margin: 36px 0; }
    h1 { font-size: 38px; font-weight: 600; letter-spacing: -.03em; }
    p { color: #cfc6e3; line-height: 1.7; }
    a { display: inline-block; margin-top: 22px; background: #d8ff80; color: #1d1530; border-radius: 6px; padding: 14px 22px; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    small { display: block; color: #a497bf; margin-top: 24px; }
  </style>
</head>
<body><main>
  <div class="tag">SPELUNKR DESKTOP · UNOFFICIAL</div>
  <div class="signal" aria-hidden="true">▥</div>
  <h1>We’ve lost the signal.</h1>
  <p>Spelunkr couldn’t be reached, or the page stopped responding. Check your internet connection and try again. The station may also be temporarily unavailable.</p>
  <a href="https://spelunkr.tv/">Try again</a>
  <small>You can also press Ctrl+R or choose Navigate → Retry connection.</small>
</main></body>
</html>
